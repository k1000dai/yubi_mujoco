name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: ${{ github.event_name != 'release' }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install
      - run: uv lock --check
      - run: uv sync --locked --only-dev
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    env:
      MUJOCO_GL: ${{ matrix.os == 'ubuntu-latest' && 'egl' || 'glfw' }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
          enable-cache: ${{ github.event_name != 'release' }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install
      - run: uv lock --check
      - name: Install software EGL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libgl1-mesa-dri libglfw3
      - name: Install package normally, not editable
        run: |
          uv sync --locked --extra video --no-editable
          uv pip check
          uv run --locked --no-sync python -c "import sys; print('YUBI_TEST_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - name: Test installed package outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/yubi-tests"
          cd "$RUNNER_TEMP/yubi-tests"
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$YUBI_TEST_PYTHON" -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -ra
          else
            "$YUBI_TEST_PYTHON" -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -m "not rendering" -ra
          fi

  distributions:
    name: Build and verify distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: ${{ github.event_name != 'release' }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install
      - run: uv lock --check
      - name: Install build tools and software EGL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libgl1-mesa-dri libglfw3
          uv sync --locked --only-dev
      - name: Build sdist, then wheel from sdist
        run: uv build
      - name: Validate metadata and packaged assets
        run: |
          uv run --locked --no-sync twine check --strict dist/*
          uv run --locked --no-sync python scripts/check_dist.py dist
      - name: Require release tag to match both distributions
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked --no-sync python scripts/check_dist.py dist --release-tag "$RELEASE_TAG"
      - name: Smoke-test wheel and sdist in separate clean environments
        run: uv run --locked --no-sync python scripts/check_dist.py dist --smoke --render --video
      - name: Save exactly the verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
